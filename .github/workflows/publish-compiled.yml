name: Publish compiled MeMeMe playtest

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download compiled build
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-d6ac-8211-9773-1ba2878e1f43/raw?se=2026-09-15T17%3A47%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=1e27985c-776e-5c62-b871-3c0560813946&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T20%3A06%3A46Z&ske=2026-09-15T20%3A06%3A46Z&sks=b&skv=2026-02-06&sig=ue3drpNFMyLO9Drf9RbNEFPUIMKvXea/ZPjvlTOvrAk%3D' -o /tmp/build.zip
          rm -rf /tmp/build && mkdir -p /tmp/build
          unzip -q /tmp/build.zip -d /tmp/build

      - name: Copy browser-only payload
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/build/index.html
          test -d /tmp/build/assets
          rm -rf assets audio index.html
          cp /tmp/build/index.html index.html
          cp -R /tmp/build/assets assets
          mkdir -p audio/bgm audio/sfx
          cp /tmp/build/audio/bgm/*.ogg audio/bgm/
          cp /tmp/build/audio/sfx/*.ogg audio/sfx/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          notice = '<!-- Copyright © 2026 MeMeMe. All rights reserved. Compiled playtest build only. -->\n'
          if not text.startswith(notice):
              p.write_text(notice + text, encoding='utf-8')
          PY
          touch .nojekyll
          test -z "$(find . -type f -name '*.map' -print -quit)"
          test ! -d src
          test ! -d tests
          test ! -d docs

      - name: Commit compiled payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MeMeMe Playtest Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets audio .nojekyll
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'publish compiled MeMeMe web playtest 0.1.65.1'
          git push origin HEAD:main
