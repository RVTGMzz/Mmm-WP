name: Sync MeMeMe 0.1.66 Web Artifact

on:
  push:
    paths:
      - .github/workflows/sync-066.yml

permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public mirror
        uses: actions/checkout@v4

      - name: Download exact 0.1.66 web artifact
        uses: actions/download-artifact@v4
        with:
          name: mememe-steamdeck-web-dist
          path: /tmp/mememe-web
          repository: ronvotri/MeMeMe-BoardGame
          run-id: 35010767705
          github-token: ${{ github.token }}

      - name: Verify artifact
        run: |
          test -f /tmp/mememe-web/index.html
          test -d /tmp/mememe-web/assets
          grep -q 'index-18fZ1c7p.js' /tmp/mememe-web/index.html
          grep -q 'index-H5khdwyb.css' /tmp/mememe-web/index.html

      - name: Replace compiled web only
        run: |
          rm -rf assets
          cp /tmp/mememe-web/index.html index.html
          cp -R /tmp/mememe-web/assets assets

      - name: Commit exact web build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets
          if git diff --cached --quiet; then
            echo 'Public mirror already matches 0.1.66.'
            exit 0
          fi
          git commit -m 'Deploy MeMeMe 0.1.66 mobile and release-resume fixes'
          git push
