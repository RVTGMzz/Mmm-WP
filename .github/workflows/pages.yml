name: Deploy MeMeMe Web Playtest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages-status.outputs.ready }}
    steps:
      - name: Checkout compiled playtest repo
        uses: actions/checkout@v4

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          cp -R audio _site/audio
          cp .nojekyll _site/.nojekyll
          cp COPYRIGHT.md _site/COPYRIGHT.md
          test -z "$(find _site -type f -name '*.map' -print -quit)"
          test ! -d _site/src
          test ! -d _site/tests
          test ! -d _site/docs

      - name: Configure GitHub Pages if enabled
        id: configure-pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Record Pages availability
        id: pages-status
        shell: bash
        run: |
          if [ '${{ steps.configure-pages.outcome }}' = 'success' ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'GitHub Pages is not enabled yet. In repository Settings -> Pages, set Source to GitHub Actions.'
          fi

      - name: Upload Pages artifact
        if: steps.configure-pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.outputs.pages_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
